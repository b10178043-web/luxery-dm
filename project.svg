<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121212"/>
      <stop offset="0.6" stop-color="#080808"/>
      <stop offset="1" stop-color="#151006"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4C2"/>
      <stop offset="0.5" stop-color="#F5C542"/>
      <stop offset="1" stop-color="#A8791C"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#F5C542" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F5C542" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F5C542" stroke-opacity="0.07"/>
    </pattern>
    <g id="flake" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path d="M0-11V11M-9.5-5.5L9.5 5.5M-9.5 5.5L9.5-5.5"/>
    </g>
  </defs>

  <rect width="640" height="800" fill="url(#bg)"/>
  <rect width="640" height="800" fill="url(#grid)"/>
  <circle cx="320" cy="300" r="300" fill="url(#glow)"/>
  <rect x="26" y="26" width="588" height="748" rx="10" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="36" y="36" width="568" height="728" rx="6" fill="none" stroke="#F5C542" stroke-opacity="0.3"/>

  <g opacity="0.75">
    <use href="#flake" x="80" y="110" transform="rotate(15 80 110)"/>
    <use href="#flake" x="560" y="150" transform="scale(0.8) translate(170 30)"/>
    <use href="#flake" x="90" y="690" transform="scale(0.7) translate(50 270)"/>
  </g>

  <text x="320" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="7" fill="url(#gold)">LUXERY DM</text>
  <path d="M170 142h300" stroke="url(#gold)" stroke-width="1"/>

  <text x="320" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="bold" letter-spacing="3" fill="url(#gold)">О ПРОЕКТЕ</text>

  <g font-family="Arial, sans-serif" font-size="24" fill="#F6F4EE">
    <text x="92" y="286">Новогодний DM-сервер на Rage MP.</text>
    <text x="92" y="330">Снег, ёлки, гирлянды и экшен.</text>
    <text x="92" y="374">Каждый день — массовые ПВП,</text>
    <text x="92" y="418">дуэли и мини-игры с игроками.</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="22" fill="url(#gold)">
    <text x="92" y="486">✦  Массовые ПВП и дуэли</text>
    <text x="92" y="526">✦  Еженедельные МП-события</text>
    <text x="92" y="566">✦  Новогодний ивент 2027</text>
    <text x="92" y="606">✦  Призы и титулы победителям</text>
  </g>

  <path d="M92 644h456" stroke="url(#gold)" stroke-opacity="0.5"/>
  <text x="92" y="690" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="url(#gold)">IP: 2.26.1.176</text>
  <text x="92" y="732" font-family="Arial, sans-serif" font-size="21" fill="#F6F4EE">Discord: discord.gg/qcXcsV6vV</text>
</svg>
